name: Release

# Push a tag like v0.1.0 to build the apps and publish a GitHub release.
# Or start it by hand from the Actions tab: enter a new tag name and the
# release (and tag) is created on the commit the workflow ran from.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.1"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Android lint in current Gradle plugins needs a Java 21 runtime.
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Optional repository secrets:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD  -> stable release signing
      #   MAPS_API_KEY                             -> offer Google Maps
      #   CARTO_API_KEY                            -> keyed CARTO map tiles
      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. The APK is signed with a throwaway debug key, so the next release won't install over this one without uninstalling first."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define=CARTO_API_KEY="$CARTO_API_KEY"
          mv build/app/outputs/flutter-apk/app-release.apk "Flock-$TAG.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Flock-*.apk

  ios:
    needs: test
    runs-on: macos-latest
    # The iPhone build is a bonus: without it the release still ships the APK.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build unsigned iOS app
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=CARTO_API_KEY="$CARTO_API_KEY"
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "Flock-$TAG-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: Flock-*-unsigned.ipa

  release:
    needs: [android, ios]
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          cat > notes.md <<'EOF'
          ## Install

          **Android:** download the `.apk` below and open it on your phone. You may need to allow installing apps from your browser or file manager.

          **iPhone:** the `-unsigned.ipa` (if attached) has to be signed before it will install, e.g. with AltStore or Sideloadly, or rebuilt in Xcode with your Apple developer account.

          ## Setup

          Open the app, enter your OwnTracks server address, the shared username and password, tap **Test connection**, then enter your name. See the README for details.

          This is an early build that hasn't been widely tested on phones yet. Please report anything odd.
          EOF
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flock $TAG" \
            --notes-file notes.md \
            --prerelease \
            --target "$GITHUB_SHA"
